name: AppDaemon Store
version: 0.1.1
slug: appdaemon-store
description: Manage AppDaemon apps from GitHub repositories (HACS replacement for AppDaemon).
url: https://github.com/mietzen/hassio-addons/tree/main/appdaemon-store
arch:
- aarch64
- amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:store
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
- homeassistant_config:rw
- all_addon_configs:rw
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Optional direct Web UI port (Ingress is enabled by default)
image: mietzen/hass-addon-appdaemon-store
options:
  apps_dir: ''
  repositories: []
  github_token: ''
  auto_update: false
  check_interval_hours: 6
  log_level: info
schema:
  apps_dir: str?
  repositories:
  - str
  github_token: password?
  auto_update: bool
  check_interval_hours: int(1,168)
  log_level: list(debug|info|warning|error)
