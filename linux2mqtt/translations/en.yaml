configuration:
  mqtt_host:
    name: MQTT Broker Host
    description: The hostname or IP address of your MQTT broker (default "core-mosquitto").
  mqtt_user:
    name: MQTT Username
    description: Username for MQTT broker authentication (leave empty if not required).
  mqtt_password:
    name: MQTT Password
    description: Password for MQTT broker authentication (leave empty if not required).
  smart_monitoring:
    name: SMART Monitoring
    description: >-
      Enables SMART hard drive monitoring and SMART self-test scheduling.
      Requires Protection mode to be disabled. Disable this if the host does not
      expose SMART data (e.g. Home Assistant OS VMs) or if you want to keep
      Protection mode enabled.
  smart_short_test_schedule:
    name: SMART Short Test Schedule
    description: >-
      Cron schedule for SMART short self-tests (default: weekly on Sunday at 3:00 AM).
      Uses standard cron syntax (e.g., "0 3 * * 0").
  smart_long_test_schedule:
    name: SMART Long Test Schedule
    description: >-
      Cron schedule for SMART extended self-tests (default: monthly on the 1st at 4:00 AM).
      Uses standard cron syntax (e.g., "0 4 1 * *").
  disk_usage:
    name: Disk Usage Monitoring
    description: >-
      Publishes disk usage metrics for the / mount. Requires Protection mode to
      be disabled. Disable this if you want to keep Protection mode enabled.
  log_verbosity:
    name: Log Verbosity
    description: >-
      Log verbosity level for linux2mqtt (1 = critical, 2 = error, 3 = warning, 4 = info, 5 = debug).
      Maps to -v through -vvvvv flags. Default is 4 (info).
